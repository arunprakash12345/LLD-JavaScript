<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Component</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="tab-container">
      <h1>Tab component</h1>
      <div class="tabs">
        <div class="tab active-tab" data-label="1"><button>Tab 1</button></div>
        <div class="tab" data-label="2"><button>Tab 2</button></div>
        <div class="tab" data-label="3"><button>Tab 3</button></div>
        <div class="tab" data-label="4"><button>Tab 4</button></div>
      </div>
      <div class="content-container">
        <div class="tab-conten active" data-label="1">
          this contains the table content of tab1
        </div>
        <div class="tab-conten" data-label="2">
          this contains the table content of tab2
        </div>
        <div class="tab-conten" data-label="3">
          this contains the table content of tab3
        </div>
        <div class="tab-conten" data-label="4">
          this contains the table content of tab4
        </div>
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
